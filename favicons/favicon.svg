<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#08080B"/>
  <!-- guide circle -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.6"/>
  <!-- right hand: square (beats 0,3,6,9 of 12) -->
  <path d="M32.0 8.0 L56.0 32.0 L32.0 56.0 L8.0 32.0 Z" fill="none" stroke="#FF2D55" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- left hand: triangle (beats 0,4,8 of 12) -->
  <path d="M32.0 8.0 L52.8 44.0 L11.2 44.0 Z" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- beat dots: white=shared, red=right only, teal=left only -->
  <circle cx="32" cy="8" r="2.5" fill="#ffffff"/>
  <circle cx="56" cy="32" r="2.5" fill="#FF2D55"/>
  <circle cx="32" cy="56" r="2.5" fill="#FF2D55"/>
  <circle cx="8" cy="32" r="2.5" fill="#FF2D55"/>
  <circle cx="52.8" cy="44" r="2.5" fill="#22D3EE"/>
  <circle cx="11.2" cy="44" r="2.5" fill="#22D3EE"/>
</svg>
